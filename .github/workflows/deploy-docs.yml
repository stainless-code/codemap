name: Deploy docs

# Unversioned /codemap FTP. `docs` label = deploy on merge without waiting for a package release.
on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    types: [closed]
    branches: [main]
  # Async release follow-up: releases created by changesets with GITHUB_TOKEN
  # cannot trigger `release: published` downstream (GITHUB_TOKEN events spawn
  # no new runs). workflow_run fires regardless of token, in its own run,
  # so Release stays untouched. Read from main, so this takes effect post-merge.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Single FTP root — don't overlap uploads.
concurrency:
  group: deploy-docs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Build & Deploy docs (FTP)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'docs')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          # The release-tag gate below needs tags even on branch checkouts.
          fetch-tags: true
          # Closed PR checkout defaults to a dead merge ref — pin the merge commit on main.
          # A workflow_run checkout defaults to default-branch HEAD, so pin the run's head SHA.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # Sitemap lastmod uses `git log` per file.
          fetch-depth: 0

      # Release runs on every main push; deploy only when its head shipped
      # a release (any tag present: every tag in these repos is a
      # changesets release tag). Skips green, no red noise.
      - name: Require release tag on head
        id: gate
        if: github.event_name == 'workflow_run'
        run: |
          if git tag --points-at HEAD | grep -q .; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        # Same gate as upload: no release, no work (still green).
        if: steps.gate.outputs.release != 'false'
        uses: ./.github/actions/setup

      # Lib dist — cheap; keep for parity / future islands that resolve package entrypoints.
      - name: Build
        if: steps.gate.outputs.release != 'false'
        run: bun run build

      - name: Generate API reference (Markdown)
        if: steps.gate.outputs.release != 'false'
        run: bun run docs:api

      # Same gates as CI `docs` — workflow_dispatch must not FTP an unaudited tree.
      - name: Validate docs links
        if: steps.gate.outputs.release != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run docs:validate -- --strict

      - name: Typecheck docs site
        if: steps.gate.outputs.release != 'false'
        run: bun run docs:check -- --isolated

      - name: Build docs site
        if: steps.gate.outputs.release != 'false'
        env:
          # Changelog github-releases source + avoid unauthenticated API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run docs:build

      - name: Audit docs site
        if: steps.gate.outputs.release != 'false'
        run: bun run docs:audit

      # FTP account root is already /codemap — server-dir ./ is correct (not ./codemap/).
      - name: Upload to /codemap via FTP
        # Gate runs on workflow_run only; skipped (empty) elsewhere, so upload proceeds.
        if: steps.gate.outputs.release != 'false'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./apps/docs/dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # Fail-closed deploy proof: the live changelog is built from the releases
      # API at build time, so only a fresh deploy can contain this run's tags.
      # No tags on HEAD (docs PR, manual dispatch): assert liveness only.
      - name: Verify live site serves this release
        if: steps.gate.outputs.release != 'false'
        run: |
          SITE="https://stainless-code.com/codemap"
          TAGS="$(git tag --points-at HEAD)"
          if [ -z "$TAGS" ]; then
            curl -sSfL -o /dev/null "$SITE/"
          else
            for TAG in $TAGS; do
              ATTEMPT=0
              until curl -sSL "$SITE/changelog" | grep -qF "$TAG"; do
                ATTEMPT=$((ATTEMPT + 1))
                if [ "$ATTEMPT" -ge 3 ]; then exit 1; fi
                sleep 30
              done
            done
          fi
